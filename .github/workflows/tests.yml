name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Always a GitHub machine: this repository is public, and a self-hosted
    # runner would run the code of any pull request in the owner's server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r web/requirements.txt
      - run: python -m unittest -v
