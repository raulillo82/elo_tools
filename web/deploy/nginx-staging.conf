# Staging of every project: each one adds its location here, at the same path
# as in production. Its own file, so that each project can add to it.
server {
    listen 80;
    server_name staging.raulillo82.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.raulillo82.duckdns.org;
    ssl_certificate     /etc/nginx/ssl/staging.crt;
    ssl_certificate_key /etc/nginx/ssl/staging.key;

    location / {
        return 404;
    }

    location = /elo {
        return 302 /elo/;
    }

    location /elo/ {
        client_max_body_size 32k;
        proxy_pass         http://127.0.0.1:5004/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /elo;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30;
    }
}
