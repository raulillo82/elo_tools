{% extends "base.html" %}
{% block content %}
<h1>{{ t('hello', name=invited['name']) }}</h1>
<p>{{ t('invite_for', club=invited['club']) }}</p>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if invited['password_hash'] %}
  <label>{{ t('your_password') }} <input type="password" name="password" required autocomplete="current-password"></label>
  {% else %}
  <label>{{ t('choose_password', n=min_password) }}
    <input type="password" name="password" required minlength="{{ min_password }}" autocomplete="new-password"></label>
  {% endif %}
  <button>{{ t('activate') }}</button>
</form>
{% endblock %}
