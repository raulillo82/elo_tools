{% extends "base.html" %}
{% block content %}
{% if known %}
<h1>{{ t('hello', name=known['name']) }}</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>{{ t('password') }} <input type="password" name="password" required autofocus autocomplete="current-password"></label>
  <button>{{ t('enter') }}</button>
</form>
{% else %}
<h1>{{ t('invite_only') }}</h1>
<p>{{ t('invite_only_text') }}</p>
{% endif %}
{% endblock %}
