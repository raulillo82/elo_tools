<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <title>{% block title %}Orden de fuerzas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Orden de fuerzas</a>
    {% if user %}
    <nav>
      <span>{{ user['name'] }} · {{ user['club'] }}</span>
      {% if user['is_admin'] %}<a href="{{ url_for('admin') }}">Accesos</a>{% endif %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link">Salir</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="notice bad">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer><a href="{{ url_for('privacy') }}">Privacidad</a></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
